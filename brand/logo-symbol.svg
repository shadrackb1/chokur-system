<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>Chokur System Symbol</title>
  <!-- Three horizontal rules like lines in a mark book, forming a bold "C" shape -->
  <!-- Top rule: longest -->
  <rect x="8" y="12" width="40" height="4" fill="#111111" rx="2"/>
  <!-- Middle rule: medium -->
  <rect x="8" y="28" width="30" height="4" fill="#111111" rx="2"/>
  <!-- Bottom rule: shortest, accent colour (C+ pass line) -->
  <rect x="8" y="44" width="20" height="4" fill="#C2410C" rx="2"/>
</svg>