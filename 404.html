<!doctype html>
<html lang="en-KE" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chokur System</title>
    <meta name="description" content="Chokur System: Kenyan secondary school marks entry, KCSE grading, class rankings, subject analysis, and printable report cards. Works offline." />
    <meta name="theme-color" content="#F6F1E7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chokur" />
    <link rel="canonical" href="https://chokur.system/" />

    <!-- Favicon & Icons -->
        <link rel="icon" type="image/svg+xml" href="/chokur-system/brand/favicon.svg" />
        <link rel="icon" type="image/x-icon" href="/chokur-system/brand/favicon.ico" />
        <link rel="apple-touch-icon" href="/chokur-system/brand/apple-touch-icon.png" />
        <link rel="manifest" href="/chokur-system/manifest.webmanifest" />
        <link rel="mask-icon" href="/chokur-system/brand/safari-pinned-tab.svg" color="#C2410C" />

    <!-- Fonts (self-hosted in production, Google Fonts for dev) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/chokur-system/sw.js').then((registration) => {
            console.log('SW registered:', registration.scope);
          }).catch((error) => {
            console.log('SW registration failed:', error);
          });
        });
      }
    </script>
  </head>
  <body class="bg-surface text-primary antialiased min-h-full font-sans">
    <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
      </body>
    </html>
